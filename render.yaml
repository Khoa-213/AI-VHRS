# Render Blueprint for the AI-VHRS backend (Dashboard -> New -> Blueprint, pick this repo).
services:
  - type: web
    name: ai-vhrs-api
    runtime: docker
    rootDir: BE
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # same region as the Supabase database (Singapore, ap-southeast-1, since 2026-11-19)
    plan: starter              # free plan sleeps and has no pre-deploy command: do not use for webhooks
    branch: main                 # change to main once the backend is merged
    autoDeploy: true
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head   # runs migrations before each new version goes live
    envVars:
      - key: DATABASE_URL      # Supabase *session pooler* string (port 5432). Set in the dashboard.
        sync: false
      - key: JWT_SECRET        # generated once by Render, then kept across deploys
        generateValue: true
      - key: SUPABASE_URL      # Storage for customer uploads (Project URL)
        sync: false
      - key: SUPABASE_SERVICE_KEY  # service_role key: secret, set in the dashboard only
        sync: false
      - key: CORS_ORIGINS      # JSON list, e.g. ["https://ai-vhrs.vercel.app"]
        sync: false
      - key: CORS_ORIGIN_REGEX # optional: Vercel preview URLs, e.g. https://ai-vhrs-[a-z0-9-]+\.vercel\.app
        sync: false
      - key: ENABLE_DOCS       # Swagger stays on so the FE team can explore the API
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS   # Render is the single reverse proxy in front of the container
        value: "true"
      # ---- AR-03 (audit 2026-11-27): settings whose code default is the SAFE-FOR-TESTS one. They were not listed here, so what
      # production ran with depended on somebody remembering the dashboard. `sync: false` = the value is set in the dashboard
      # and this file never overwrites it; listing them makes Render ask for them when the service is created.
      - key: PAYMENT_MODE              # mock | sandbox | live. Code default: mock (simulated payments)
        sync: false
      - key: ALLOW_TEST_PAYMENTS       # true ONLY on a demo / test deployment. Code default: false = mock and sandbox payments
        sync: false                    # are refused and only a real gateway (payOS) can confirm an order (D01)
      - key: BACKGROUND_JOBS_ENABLED   # true on this one instance, or quotations never expire, unpaid deposits are never
        sync: false                    # cancelled, nobody is auto-accepted and photos / AI chats are never purged
      - key: MOTION_VALIDATION_REQUIRED  # true where a real robot is driven: a simulation result counts only after the
        sync: false                      # server has re-validated it. Code default: false (the client's "passed" is trusted)
      - key: PRODUCTION_SIGNING_KEY    # Ed25519 private key (scripts/production_key.py new). Without it nothing can be scheduled
        sync: false
      - key: DB_LOCK_TIMEOUT_MS        # optional. Code default 20000: a statement gives up on a row lock after 20 s (AR-02)
        sync: false
