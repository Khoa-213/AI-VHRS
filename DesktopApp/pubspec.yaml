name: ai_vhrs_mobile
description: "AI-VHRS technician desk (Windows) - robotic handwriting workshop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Network & API
  dio: ^5.7.0

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Image Handling
  image_picker: ^1.1.2

  # UI Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  logger: ^2.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # Script faces the robot writes with (OFL, same as the FE catalog).
    - family: DancingScript
      fonts:
        - asset: assets/fonts/script/DancingScript.ttf
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/script/GreatVibes-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/script/Caveat.ttf
